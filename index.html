<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Three.js Quick Start</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
     <p>WASD - управление, qe - управление близостью куба</p>
    <script type="module">
      import * as G3D from 'https://unpkg.com/three@0.160.0/build/three.module.js';

      const scene = new G3D.Scene();
      const camera = new G3D.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new G3D.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      
      const блок = new G3D.BoxGeometry(1, 1, 1);
      const трава = new G3D.MeshBasicMaterial({ color: 0x00ff00 });
      const песок = new G3D.MeshBasicMaterial({ color: 0xffff00 });
      const земля = new G3D.MeshBasicMaterial({ color: 0x422f08 });
      const дерево = new G3D.MeshBasicMaterial({ color: 0x302206 })
      const cube = new G3D.Mesh(блок, трава); const cube2 = new G3D.Mesh(блок, земля); const cube3 = new G3D.Mesh(блок, земля); const cube4 = new G3D.Mesh(блок, трава); const cube5 = new G3D.Mesh(блок, земля); const cube6 = new G3D.Mesh(блок, земля); const cube7 = new G3D.Mesh(блок, трава); const cube8 = new G3D.Mesh(блок, земля); const cube9 = new G3D.Mesh(блок, земля); const cube10 = new G3D.Mesh(блок, трава); const cube11 = new G3D.Mesh(блок, земля); const cube12 = new G3D.Mesh(блок, земля); const cube13 = new G3D.Mesh(блок, трава); const cube14 = new G3D.Mesh(блок, земля); const cube15 = new G3D.Mesh(блок, земля); const cube16 = new G3D.Mesh(блок, трава); const cube17 = new G3D.Mesh(блок, земля); const cube18 = new G3D.Mesh(блок, земля);
      cube2.position.z = -1; cube3.position.z = -2; cube4.position.x = 1; cube5.position.x = 1; cube5.position.z = -1; cube6.position.x = 1; cube6.position.z = -2; cube7.position.x = 2; cube8.position.x = 2; cube8.position.z = -1; cube9.position.x = 2; cube9.position.z = -2; cube10.position.y = 1; cube11.position.y = 1; cube11.position.z = -1; cube12.position.y = 1; cube12.position.z = -2; cube13.position.x = 1; cube13.position.y = 1; cube14.position.x = 1; cube14.position.y = 1; cube14.position.z = -1; cube15.position.x = 1; cube15.position.y = 1; cube15.position.z = -2; cube16.position.x = 2; cube16.position.y = 1; cube17.position.x = 2; cube17.position.y = 1; cube17.position.z = -1; cube18.position.x = 2; cube18.position.y = 1; cube18.position.z = -2;
      scene.add(cube); scene.add(cube2); scene.add(cube3); scene.add(cube4); scene.add(cube5); scene.add(cube6); scene.add(cube7); scene.add(cube8); scene.add(cube9); scene.add(cube10); scene.add(cube11); scene.add(cube12); scene.add(cube13); scene.add(cube14); scene.add(cube15); scene.add(cube16); scene.add(cube17); scene.add(cube18);

      camera.position.z = 5;

      renderer.render(scene, camera);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectwionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      document.addEventListener('keydown', function(event) {
        if (event.key === 'a') {
            camera.position.x--;

      renderer.render(scene, camera);
        }
        if (event.key === 'd') {
            camera.position.x++;

      renderer.render(scene, camera);
        }
        if (event.key === 'w') {
            camera.position.y++;

      renderer.render(scene, camera);
        }
        if (event.key === 's') {
            camera.position.y--;

      renderer.render(scene, camera);
        }
      });
      window.g3d = { camera, renderer }
    </script>
  </body>
</html>
