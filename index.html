<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>BlocksCraft8787</title>
        <style>
            body { margin: 0; overflow: hidden; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <p>BlocksCraft8787 — тестовая игра-песочница</p>
        <p>WASD — вперёд/назад/влево/вправо, Q/E — вверх/вниз</p>
        <script type="module">
            import * as G3D from 'https://unpkg.com/three@0.160.0/build/three.module.js';

            const scene = new G3D.Scene();
            const light = new G3D.AmbientLight(0xffffff, 1);
            scene.add(light);

            const camera = new G3D.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new G3D.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const блок = new G3D.BoxGeometry(1, 1, 1);
            const трава = new G3D.MeshBasicMaterial({ color: 0x00ff00 });
            const земля = new G3D.MeshBasicMaterial({ color: 0x422f08 });

            const cube = new G3D.Mesh(блок, трава); const cube2 = new G3D.Mesh(блок, земля); const cube3 = new G3D.Mesh(блок, земля);
            const cube4 = new G3D.Mesh(блок, трава); const cube5 = new G3D.Mesh(блок, земля); const cube6 = new G3D.Mesh(блок, земля);
            const cube7 = new G3D.Mesh(блок, трава); const cube8 = new G3D.Mesh(блок, земля); const cube9 = new G3D.Mesh(блок, земля);
            const cube10 = new G3D.Mesh(блок, трава); const cube11 = new G3D.Mesh(блок, земля); const cube12 = new G3D.Mesh(блок, земля);
            const cube13 = new G3D.Mesh(блок, трава); const cube14 = new G3D.Mesh(блок, земля); const cube15 = new G3D.Mesh(блок, земля);
            const cube16 = new G3D.Mesh(блок, трава); const cube17 = new G3D.Mesh(блок, земля); const cube18 = new G3D.Mesh(блок, земля);
            const cube19 = new G3D.Mesh(блок, трава); const cube20 = new G3D.Mesh(блок, земля); const cube21 = new G3D.Mesh(блок, земля);
            const cube22 = new G3D.Mesh(блок, трава); const cube23 = new G3D.Mesh(блок, земля); const cube24 = new G3D.Mesh(блок, земля);
            const cube25 = new G3D.Mesh(блок, трава); const cube26 = new G3D.Mesh(блок, земля); const cube27 = new G3D.Mesh(блок, земля);
            const cube28 = new G3D.Mesh(блок, трава); const cube29 = new G3D.Mesh(блок, земля); const cube30 = new G3D.Mesh(блок, земля);

            cube2.position.y = -1;
            cube3.position.y = -2;
            cube4.position.x = 1;
            cube5.position.set(1, -1, 0);
            cube6.position.set(1, -2, 0);
            cube7.position.x = 2;
            cube8.position.set(2, -1, 0);
            cube9.position.set(2, -2, 0);
            cube10.position.z = 1;
            cube11.position.set(0, -1, 1);
            cube12.position.set(0, -2, 1);
            cube13.position.set(1, 0, 1);
            cube14.position.set(1, -1, 1);
            cube15.position.set(1, -2, 1);
            cube16.position.set(2, 0, 1);
            cube17.position.set(2, -1, 1);
            cube18.position.set(2, -2, 1);
            cube19.position.set(2, 0, 2);
            cube20.position.set(2, -1, 2);
            cube21.position.set(2, -2, 2);
            cube22.position.set(1, 0, 2);
            cube23.position.set(1, -1, 2);
            cube24.position.set(1, -2, 2);
            cube25.position.set(0, 0, 2);
            cube26.position.set(0, -1, 2);
            cube27.position.set(0, -2, 2);
            cube28.position.set(-1, 0, 2);
            cube29.position.set(-1, -1, 2);
            cube30.position.set(-1, -2, 2);

            const cube31 = new G3D.Mesh(блок, земля);
            const cube32 = new G3D.Mesh(блок, земля);
            const cube33 = new G3D.Mesh(блок, трава);
            const cube34 = new G3D.Mesh(блок, земля);
            const cube35 = new G3D.Mesh(блок, земля);
            const cube36 = new G3D.Mesh(блок, трава);
            const cube37 = new G3D.Mesh(блок, земля);
            const cube38 = new G3D.Mesh(блок, земля);
            const cube39 = new G3D.Mesh(блок, трава);

            cube31.position.set(-1, -1, 3);
            cube32.position.set(-1, 0, 3);
            cube33.position.set(-1, 1, 3);
            cube34.position.set(0, -1, 3);
            cube35.position.set(0, 0, 3);
            cube36.position.set(0, 1, 3);
            cube37.position.set(1, -1, 3);
            cube38.position.set(1, 0, 3);
            cube39.position.set(1, 1, 3);

            scene.add(
                cube, cube2, cube3, cube4, cube5, cube6, cube7, cube8, cube9, cube10,
                cube11, cube12, cube13, cube14, cube15, cube16, cube17, cube18, cube19, cube20,
                cube21, cube22, cube23, cube24, cube25, cube26, cube27, cube28, cube29, cube30,
                cube31, cube32, cube33, cube34, cube35, cube36, cube37, cube38, cube39
            );

            camera.position.y = 3;
            camera.position.z = 8;

            const keys = { a: false, d: false, w: false, s: false, q: false, e: false, up: false, down: false, left: false, right: false };
            const speed = 0.2;
            const sR = 0.01;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'a') keys.a = true;
                if (event.key === 'd') keys.d = true;
                if (event.key === 'w') keys.w = true;
                if (event.key === 's') keys.s = true;
                if (event.key === 'q') keys.q = true;
                if (event.key === 'e') keys.e = true;
                if (event.key === 'ArrowUp') keys.up = true;
                if (event.key === 'ArrowDown') keys.down = true;
                if (event.key === 'ArrowLeft') keys.left = true;
                if (event.key === 'ArrowRight') keys.right = true;
            });
            document.addEventListener('keyup', (event) => {
                if (event.key === 'a') keys.a = false;
                if (event.key === 'd') keys.d = false;
                if (event.key === 'w') keys.w = false;
                if (event.key === 's') keys.s = false;
                if (event.key === 'q') keys.q = false;
                if (event.key === 'e') keys.e = false;
                if (event.key === 'ArrowUp') keys.up = false;
                if (event.key === 'ArrowDown') keys.down = false;
                if (event.key === 'ArrowLeft') keys.left = false;
                if (event.key === 'ArrowRight') keys.right = false;
            });

            function animate() {
                requestAnimationFrame(animate);
                if (keys.a) camera.position.x -= speed;
                if (keys.d) camera.position.x += speed;
                if (keys.w) camera.position.z -= speed;
                if (keys.s) camera.position.z += speed;
                if (keys.q) camera.position.y += speed;
                if (keys.e) camera.position.y -= speed;
                if (keys.up) camera.rotation.x += sR;
                if (keys.down) camera.rotation.x -= sR;
                if (keys.left) camera.rotation.y -= sR;
                if (keys.right) camera.rotation.y += sR;
                renderer.render(scene, camera);
            }
            animate();

            window.g3d = { camera, renderer };
        </script>
    </body>
</html>
