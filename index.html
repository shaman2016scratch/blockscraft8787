<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>BlocksCraft8787</title>
        <style>
            body { margin: 0; overflow: hidden; }
            canvas { display: block; }
        </style>
    </head>
    <body>
        <p>BlocksCraft8787 - тестовая игра-песочница</p>
        <p>WASD - управление, Q/E - вверх/вниз, P - показать координаты</p>
        <script type="module">
            import * as G3D from 'https://unpkg.com/three@0.160.0/build/three.module.js';

            const scene = new G3D.Scene();
            const light = new G3D.AmbientLight(0xffffff, 1);
            scene.add(light);

            const camera = new G3D.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new G3D.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const блок = new G3D.BoxGeometry(1, 1, 1);
            const трава = new G3D.MeshBasicMaterial({ color: 0x00ff00 });
            const земля = new G3D.MeshBasicMaterial({ color: 0x422f08 });

            const cube = new G3D.Mesh(блок, трава); const cube2 = new G3D.Mesh(блок, земля); const cube3 = new G3D.Mesh(блок, земля);
            const cube4 = new G3D.Mesh(блок, трава); const cube5 = new G3D.Mesh(блок, земля); const cube6 = new G3D.Mesh(блок, земля);
            const cube7 = new G3D.Mesh(блок, трава); const cube8 = new G3D.Mesh(блок, земля); const cube9 = new G3D.Mesh(блок, земля);
            const cube10 = new G3D.Mesh(блок, трава); const cube11 = new G3D.Mesh(блок, земля); const cube12 = new G3D.Mesh(блок, земля);
            const cube13 = new G3D.Mesh(блок, трава); const cube14 = new G3D.Mesh(блок, земля); const cube15 = new G3D.Mesh(блок, земля);
            const cube16 = new G3D.Mesh(блок, трава); const cube17 = new G3D.Mesh(блок, земля); const cube18 = new G3D.Mesh(блок, земля);
            const cube19 = new G3D.Mesh(блок, трава); const cube20 = new G3D.Mesh(блок, земля); const cube21 = new G3D.Mesh(блок, земля);
            const cube22 = new G3D.Mesh(блок, трава); const cube23 = new G3D.Mesh(блок, земля); const cube24 = new G3D.Mesh(блок, земля);
            const cube25 = new G3D.Mesh(блок, трава); const cube26 = new G3D.Mesh(блок, земля); const cube27 = new G3D.Mesh(блок, земля);
            const cube28 = new G3D.Mesh(блок, трава); const cube29 = new G3D.Mesh(блок, земля); const cube30 = new G3D.Mesh(блок, земля);
            const cube31 = new G3D.Mesh(блок, трава); const cube32 = new G3D.Mesh(блок, земля); const cube33 = new G3D.Mesh(блок, земля);
            const cube34 = new G3D.Mesh(блок, трава); const cube35 = new G3D.Mesh(блок, земля); const cube36 = new G3D.Mesh(блок, земля);
            const cube37 = new G3D.Mesh(блок, трава); const cube38 = new G3D.Mesh(блок, земля); const cube39 = new G3D.Mesh(блок, земля);

            cube2.position.y = -1;
            cube3.position.y = -2;
            cube4.position.x = 1;
            cube5.position.x = 1; cube5.position.y = -1;
            cube6.position.x = 1; cube6.position.y = -2;
            cube7.position.x = 2;
            cube8.position.x = 2; cube8.position.y = -1;
            cube9.position.x = 2; cube9.position.y = -2;
            cube10.position.z = 1;
            cube11.position.z = 1; cube11.position.y = -1;
            cube12.position.z = 1; cube12.position.y = -2; 
            cube13.position.x = 1; cube13.position.z = 1;
            cube14.position.x = 1; cube14.position.z = 1; cube14.position.y = -1;
            cube15.position.x = 1; cube15.position.z = 1; cube15.position.y = -2;
            cube16.position.x = 2; cube16.position.z = 1;
            cube17.position.x = 2; cube17.position.z = 1; cube17.position.y = -1;
            cube18.position.x = 2; cube18.position.z = 1; cube18.position.y = -2;
            cube19.position.x = 2; cube19.position.z = 2;
            cube20.position.x = 2; cube20.position.z = 2; cube20.position.y = -1;
            cube21.position.x = 2; cube21.position.z = 2; cube21.position.y = -2;
            cube22.position.x = 1; cube22.position.z = 2;
            cube23.position.x = 1; cube23.position.z = 2; cube23.position.y = -1;
            cube24.position.x = 1; cube24.position.z = 2; cube24.position.y = -2;
            cube25.position.z = 2;
            cube26.position.z = 2; cube26.position.y = -1;
            cube27.position.z = 2; cube27.position.y = -2;
            cube28.position.x = -1; cube28.position.z = 2;
            cube29.position.x = -1; cube29.position.z = 2; cube29.position.y = -1;
            cube30.position.x = -1; cube30.position.z = 2; cube30.position.y = -2;
            cube31.position.x = -1; cube31.position.y = -1; cube31.position.z = 3;
            cube32.position.x = -1; cube32.position.z = 3;
            cube33.position.x = -1; cube33.position.z = 3; cube33.position.y = 1;
            cube34.position.x = 0; cube34.position.y = -1; cube34.position.z = 3;
            cube35.position.x = 0; cube35.position.z = 3;
            cube36.position.x = 0; cube36.position.z = 3; cube36.position.y = 1;
            cube37.position.x = 0; cube37.position.y = -1; cube37.position.z = 3;
            cube38.position.x = 0; cube38.position.z = 3;
            cube39.position.x = 0; cube39.position.z = 3; cube39.position.y = 1;

            scene.add(cube, cube2, cube3, cube4, cube5, cube6, cube7, cube8, cube9, cube10,
                      cube11, cube12, cube13, cube14, cube15, cube16, cube17, cube18, cube19, cube20,
                      cube21, cube22, cube23, cube24, cube25, cube26, cube27, cube28, cube29, cube30,
                      cube31, cube32, cube33, cube34, cube35, cube36, cube37, cube38, cube39);

            camera.position.y = 2;
            camera.position.z = 6;

            const keys = { a: false, d: false, w: false, s: false, q: false, e: false };
            const speed = 0.2;

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'a') keys.a = true;
                if (event.key === 'd') keys.d = true;
                if (event.key === 'w') keys.w = true;
                if (event.key === 's') keys.s = true;
                if (event.key === 'q') keys.q = true;
                if (event.key === 'e') keys.e = true;
                if (event.key === 'p') {
                    alert([camera.position.x, camera.position.y, camera.position.z].join(" "));
                }
            });
            document.addEventListener('keyup', (event) => {
                if (event.key === 'a') keys.a = false;
                if (event.key === 'd') keys.d = false;
                if (event.key === 'w') keys.w = false;
                if (event.key === 's') keys.s = false;
                if (event.key === 'q') keys.q = false;
                if (event.key === 'e') keys.e = false;
            });

            function animate() {
                requestAnimationFrame(animate);

                if (keys.a) camera.position.x -= speed;
                if (keys.d) camera.position.x += speed;
                if (keys.w) camera.position.z -= speed;
                if (keys.s) camera.position.z += speed;
                if (keys.q) camera.position.y += speed;
                if (keys.e) camera.position.y -= speed;

                renderer.render(scene, camera);
            }
            animate();

            window.g3d = { camera, renderer };
        </script>
    </body>
</html>
